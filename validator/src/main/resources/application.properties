spring.application.name=pdf-validator
spring.main.banner-mode=off
server.port=${VALIDATOR_PORT:8090}
server.tomcat.threads.max=8
server.tomcat.max-swallow-size=26214400
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.write-dates-as-timestamps=false

validator.dss-version=@dss.version@
validator.max-document-bytes=${VALIDATOR_MAX_DOCUMENT_BYTES:26214400}
validator.max-concurrency=${VALIDATOR_MAX_CONCURRENCY:2}

# offline = jen cache ve volume; online = navíc obnova LOTL/TL na pozadí.
validator.tl.mode=${VALIDATOR_TL_MODE:offline}
validator.tl.cache-dir=${VALIDATOR_TL_CACHE_DIR:/var/cache/validator/tl}
validator.tl.oj-keystore=${VALIDATOR_OJ_KEYSTORE:/app/oj-keystore.p12}
validator.tl.max-age-hours=${VALIDATOR_TL_MAX_AGE_HOURS:24}
validator.tl.refresh-hours=${VALIDATOR_TL_REFRESH_HOURS:6}

validator.revocation.online=${VALIDATOR_REVOCATION_ONLINE:true}
# Jen pro testy: adresář s PEM, které se berou jako důvěryhodné. Nikdy v provozu.
validator.test-trust-anchors=${VALIDATOR_TEST_TRUST_ANCHORS:}
