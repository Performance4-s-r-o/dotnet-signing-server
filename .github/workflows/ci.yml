name: CI

# pull_request (not pull_request_target) — fork PRs must run with a read-only
# token and no access to repository secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      # Ghostscript renders pages for AI hidden-text protection and code scanning; without it those tests cannot run.
      - name: Install Ghostscript
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ghostscript

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages*.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The lock files pin every package, also the transitive ones (#84). A restore that would
      # change one fails: update them on purpose with `dotnet restore --force-evaluate`.
      - name: Restore
        run: dotnet restore --locked-mode

      # Release is what the image ships (no Testcontainers) and has its own lock file. Restored
      # before the build so that the Release build compiles against the Release package set.
      - name: Restore (Release lock file)
        run: dotnet restore dotnet-signing-server.csproj -p:Configuration=Release --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test tests/DotNetSigningServer.Tests/DotNetSigningServer.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      # Known vulnerable packages of what the image ships (the Release restore just above; the
      # Debug set holds dev-only Testcontainers with its own findings). Transitive ones too.
      # High and critical fail the build.
      - name: NuGet vulnerabilities
        shell: bash
        run: |
          set -o pipefail
          dotnet list dotnet-signing-server.csproj package --vulnerable --include-transitive --no-restore 2>&1 | tee nuget-audit.txt
          if grep -E '^\s*>.*\b(High|Critical)\b' nuget-audit.txt; then
            echo "::error::A NuGet package with a high or critical vulnerability"
            exit 1
          fi
          # No finding is only trustworthy when the audit says it ran (a failed feed query prints nothing).
          if ! grep -qE 'has no vulnerable packages|no vulnerable packages' nuget-audit.txt && ! grep -qE 'following vulnerable packages' nuget-audit.txt; then
            echo "::error::The NuGet vulnerability audit did not complete"
            exit 1
          fi

      # A run that fails once and passes on a retry tells you nothing without this:
      # the name of the test that failed is in the result file, not in the log tail.
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: 14

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Verify formatting
        run: dotnet format dotnet-signing-server.sln --verify-no-changes --verbosity diagnostic
